# En un sistema ostree /var no viene en la imagen: las carpetas de libvirt se
# crean en el primer arranque con la etiqueta SELinux genérica (var_lib_t) y
# libvirt no puede crear las suyas ("cannot create directory
# /var/lib/libvirt/dnsmasq: Permission denied", la red default no arranca).
# Z sin dueño ni permisos solo devuelve la etiqueta correcta (virt_var_lib_t).
# Bazzite lo hace a mano con restorecon en "ujust setup-virtualization".
Z /var/lib/libvirt - - - -
Z /var/log/libvirt - - - -

# swtpm (TPM de las máquinas virtuales) guarda aquí su autoridad de certificados
# y corre como tss.
d /var/lib/swtpm-localca 0750 tss tss -
z /var/lib/swtpm-localca - - - -
