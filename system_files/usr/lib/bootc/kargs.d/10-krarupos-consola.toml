# Letra de las TTY (Ctrl+Alt+F2…): Terminus 16x32, el mismo tamaño que pone el
# kernel de CachyOS. La de Fedora (8x16) queda diminuta en 4K. vconsole.font
# manda sobre /etc/vconsole.conf, que escribe el instalador. En un PC real llega
# antes que la consola de amdgpu; getty@.service.d/50-krarupos-letra.conf la pone
# al abrir cada TTY.
kargs = ["vconsole.font=ter-v32b"]
match-architectures = ["x86_64"]
