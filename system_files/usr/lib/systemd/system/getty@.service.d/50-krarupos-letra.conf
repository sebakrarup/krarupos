# Letra grande al abrir cada TTY. vconsole.font (kargs.d/10-krarupos-consola.toml)
# llega tarde en un PC real: systemd-vconsole-setup corre cuando la consola
# todavía es "dummy" (fbcon espera a amdgpu) y setfont falla; cuando amdgpu
# toma la consola, las TTY ya están ocupadas y no se reintenta.
[Service]
ExecStartPre=-/usr/bin/setfont -C /dev/%I ter-v32b
