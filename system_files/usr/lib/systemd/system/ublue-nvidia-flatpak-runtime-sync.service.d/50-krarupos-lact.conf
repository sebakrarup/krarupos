# En el primer arranque de las variantes NVIDIA, el runtime GL de NVIDIA para
# Flatpak se baja unos minutos después de que lactd ya partió; el sandbox de LACT
# no lo ve hasta reiniciarse (sale "NVML is missing" y la app muestra un error).
# ExecCondition del servicio lo salta si ya está instalado, así que esto solo
# corre cuando de verdad bajó un runtime nuevo (primer arranque o driver nuevo).
[Service]
ExecStartPost=-/usr/bin/systemctl try-restart --no-block lactd.service
