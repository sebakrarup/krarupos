# Sunshine (Flatpak) a veces se cae al desconectarse Moonlight: al devolver el
# sonido a la salida normal, libpulse aborta (Assertion '*_head == _item' failed
# at operation.c:85). Arranca con KDE por autostart, que no reinicia: se quedaba
# cerrado. Si sale con error vuelve a los 5 s; si se cierra bien (salir desde la
# bandeja), no.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
