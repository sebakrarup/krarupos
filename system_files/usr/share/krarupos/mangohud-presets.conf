# Nivel 2 del overlay de rendimiento de Steam (Game Mode)
# = preset horizontal de MangoHud + temperaturas (junction en la GPU) y ventilador
# El orden de las líneas es el orden en pantalla
[preset 2]
legacy_layout=0
horizontal
hud_no_margin
table_columns=14
background_alpha=0
fps
@FPS_TEXT@
frametime=0
frame_timing=1
gpu_stats
gpu_junction_temp
gpu_fan
gpu_power
cpu_stats
cpu_temp
cpu_power
ram
battery
