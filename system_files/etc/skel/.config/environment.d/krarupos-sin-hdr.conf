# krarupOS: Game Mode sin HDR. Steam lo prendía solo en los monitores HDR y se
# veía mal; así Steam no lo ofrece. gamescope-session-plus lee este archivo
# después de su configuración de Steam (que pone 1). Para tener la opción de
# HDR en Steam, borrar este archivo y volver a entrar a Game Mode.
STEAM_GAMESCOPE_HDR_SUPPORTED=0
