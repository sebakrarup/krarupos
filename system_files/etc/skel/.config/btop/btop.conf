#? Config file for btop
# krarupOS: en Ryzen el sensor automático no muestra la temperatura del
# promedio de la CPU; Tctl es la temperatura general. Sin k10temp (Intel)
# btop vuelve al automático. Lo demás lo completa btop al cerrarse.
cpu_sensor = "k10temp/Tctl"
# Caja de la GPU visible desde el inicio (sin apretar 5).
shown_boxes = "cpu mem net proc gpu0"
# Lista de procesos sin degradado de color.
proc_gradient = false
