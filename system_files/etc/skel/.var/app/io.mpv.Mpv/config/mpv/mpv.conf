# GPU decoding: AV1 and high-fps video stutter on CPU
hwdec=vaapi

# Cerrar al terminar el video (mpv 0.42 se queda abierto si no)
idle=once

# Sin avisar SDR/HDR al monitor: en una TTY ese aviso hace que monitores con
# HDR queden en negro unos segundos al abrir el video
target-colorspace-hint=no

# TTY (sin sesión gráfica): video a tamaño real y centrado, sin agrandarlo a
# pantalla completa; si es más grande que la pantalla, se achica para que quepa
[tty-tamano-real]
profile-cond=os.getenv("WAYLAND_DISPLAY") == nil and os.getenv("DISPLAY") == nil
profile-restore=copy
video-unscaled=downscale-big
