# Instalador de krarupOS. Instala la imagen que lleva dentro y la deja
# apuntando a ghcr.io, con firma, para que se actualice sola.
# build-disk.yml cambia "krarupos" por la variante elegida (krarupos-deck, krarupos-nvidia, krarupos-deck-nvidia).
[customizations.installer.kickstart]
contents = """
%post
# El instalador deja el reloj de la placa en hora local, pero en un PC solo con
# Linux guarda UTC. En América el primer arranque quedaba horas adelantado y los
# archivos de SDDM con fecha futura, así que "Ir a escritorio" volvía a modo juego.
cat >/etc/adjtime <<'EOF'
0.0 0 0.0
0
UTC
EOF
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry ghcr.io/sebakrarup/krarupos:latest
%end

%post --nochroot
# Apps de Flathub que trae la ISO (disk_config/flatpaks-iso.sh): se copian al /var
# del sistema instalado y krarupos-flatpaks las instala en el primer arranque.
origen=""
for d in /run/install/repo /run/install/source /run/install/isodir; do
    [ -d "$d/krarupos-flatpak/repo" ] && origen=$d/krarupos-flatpak && break
done
if [ -z "$origen" ]; then
    mkdir -p /mnt/krarupos-iso
    if mount -o ro /dev/disk/by-label/Container-Installer-x86_64 /mnt/krarupos-iso; then
        [ -d /mnt/krarupos-iso/krarupos-flatpak/repo ] && origen=/mnt/krarupos-iso/krarupos-flatpak
    fi
fi
var=""
for d in /mnt/sysroot/ostree/deploy/*/var /mnt/sysimage/var; do
    [ -d "$d" ] && var=$d && break
done
if [ -n "$origen" ] && [ -n "$var" ]; then
    mkdir -p "$var/lib/krarupos"
    rm -rf "$var/lib/krarupos/flatpak-iso"
    cp -r "$origen" "$var/lib/krarupos/flatpak-iso" || rm -rf "$var/lib/krarupos/flatpak-iso"
fi
umount /mnt/krarupos-iso 2>/dev/null || true

# Nombre del disco del sistema: el instalador lo deja "krarupos_<nombre del PC>" y
# así aparece en Dolphin. Solo cambia la etiqueta (el arranque usa el UUID).
for d in /mnt/sysroot /mnt/sysimage; do
    if [ "$(findmnt -no FSTYPE "$d" 2>/dev/null)" = btrfs ]; then
        btrfs filesystem label "$d" krarupOS || true
        break
    fi
done
%end

%post --nochroot --erroronfail --log=/tmp/krarupos-compresion.log
# Comprimir el sistema recién instalado (zstd). El instalador lo escribe sin
# compresión (Fedora Atomic no aplica el compress del fstab) y después
# krarupos-compresion.service solo comprime lo nuevo. --erroronfail: si no
# funciona, la instalación se detiene y avisa en vez de dejar un sistema sin
# comprimir sin que nadie se entere.
set -euo pipefail
raiz=""
for d in /mnt/sysroot /mnt/sysimage; do
    if [ "$(findmnt -no FSTYPE "$d" 2>/dev/null)" = btrfs ]; then
        raiz=$d
        break
    fi
done
[ -n "$raiz" ] || { echo "krarupOS: no se encontró el btrfs del sistema"; exit 1; }
# En el instalador /usr del sistema está montado de solo lectura: se monta el
# btrfs entero (subvolid=5) aparte, con escritura, y se comprime ahí.
disco=$(findmnt -nvo SOURCE "$raiz")
[ -b "$disco" ] || { echo "krarupOS: no se encontró el disco de $raiz ($disco)"; exit 1; }
todo=/mnt/krarupos-btrfs
mkdir -p "$todo"
mount -o subvolid=5,rw "$disco" "$todo"
trap 'umount "$todo" 2>/dev/null || true' EXIT
antes=$(df -B1M --output=used "$todo" | tail -1)
btrfs filesystem defragment -r -czstd "$todo"
sync
btrfs filesystem sync "$todo"
despues=$(df -B1M --output=used "$todo" | tail -1)
echo "krarupOS: compresión del sistema: ${antes} MB -> ${despues} MB"
# Si no bajó al menos un 15 %, la compresión no hizo efecto.
[ $((despues * 100)) -le $((antes * 85)) ] || { echo "krarupOS: la compresión no redujo el espacio"; exit 1; }
var=""
for d in "$todo"/ostree/deploy/*/var "$todo"/*/ostree/deploy/*/var; do
    [ -d "$d" ] && var=$d && break
done
if [ -n "$var" ]; then
    mkdir -p "$var/log"
    cp /tmp/krarupos-compresion.log "$var/log/krarupos-compresion-instalacion.log" || true
fi
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
